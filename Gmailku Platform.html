<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmailku - Platform Freelance Pembuatan Gmail</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Montserrat & Bebas Neue -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        tailwind.config = {

                extend: {

                        sans: ['Montserrat', 'sans-serif'],
                        display: ['Bebas Neue', 'cursive']
                    }
                }
            }
        }

</head>
<body class="h-full bg-gmailGray text-gmailDark font-sans antialiased selection:bg-gmailRed selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="min-h-full flex flex-col">
        <!-- Dynamic content rendered by JS -->
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- State Management ---
        const STORAGE_KEY = 'gmailku_app_data_v5';
        
        let db = {
            currentUser: null,
            users: [
                { username: 'Wheizyy25gmailku2011', pass: '201125', role: 'developer', saldo: 150000, gmailsCreated: 18, telegramLinked: '@Bimatreder' },
                { username: 'user1', pass: 'user123', role: 'user', saldo: 8000, gmailsCreated: 1, telegramLinked: '' }
            ],
            globalGmailsCreated: 19,
            devTelegram: '@Bimatreder',
            activeTask: null,
            history: [
                { type: 'gmail', desc: 'Pembuatan Gmail: rifaisimarmatapej931@gmail.com', reward: 8000, date: '2026-03-30 14:20' }
            ],
            withdrawals: [],
            customFormatTemplate: `📄 BUAT GMAIL DENGAN DATA BERIKUT\n\n🗓 Tanggal Lahir: {year} (tahun 1999-2002)\n📧 Email: {email}\n🔒 Sandi: {password}\n👤 Nama Depan & Belakang: BEBAS\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n❗ Apakah Anda sudah membuat Gmail sesuai data di atas?`
        };

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    db = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse storage', e);
                }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        loadData();

        // --- Toast System ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-gmailGreen' : type === 'error' ? 'bg-gmailRed' : 'bg-gmailBlue';
            toast.className = `pointer-events-auto ${bgCol} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-sm font-medium transition-all`;
            
            let icon = 'fa-check-circle';
            if (type === 'error') icon = 'fa-exclamation-circle';
            if (type === 'info') icon = 'fa-info-circle';

            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function generateRandomGmailData() {
            const firstNames = ['rifai', 'budi', 'siti', 'agus', 'dewi', 'eko', 'sri', 'joko', 'ratna', 'ahmad'];
            const lastNames = ['simarmata', 'santoso', 'wijaya', 'pratama', 'lestari', 'nugroho', 'putri', 'setiawan'];
            const randomName = firstNames[Math.floor(Math.random() * firstNames.length)] + lastNames[Math.floor(Math.random() * lastNames.length)] + Math.floor(Math.random() * 900 + 100);
            const email = `${randomName}@gmail.com`;
            const passwords = ['fineirga', 'sandioke99', 'rahasia123', 'amanjaya88', 'cuanmulu2026'];
            const password = passwords[Math.floor(Math.random() * passwords.length)];
            const year = Math.floor(Math.random() * 4) + 1999;

            return { email, password, year };
        }

        let userTab = 'tugas'; // 'tugas', 'riwayat', 'withdraw'
        let devTab = 'overview'; // 'overview', 'users', 'withdrawals', 'telegram'

        // --- Main Router / Render ---
        function render() {
            const app = document.getElementById('app');
            if (!db.currentUser) {
                app.innerHTML = renderAuthScreen();
            } else if (db.currentUser.role === 'developer') {
                app.innerHTML = renderDeveloperScreen();
            } else {
                app.innerHTML = renderUserDashboard();
            }
        }

        // --- 1. AUTH SCREEN (Without developer hints, custom dev account) ---
        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-red-50 via-blue-50 to-yellow-50">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-gmailRed via-gmailBlue to-gmailYellow"></div>
                        <div class="text-center mb-6">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-red-50 rounded-2xl mb-3 text-gmailRed shadow-inner">
                                <i class="fa-solid fa-envelope text-3xl"></i>
                            </div>
                            <h1 class="text-4xl font-display tracking-wide text-gmailDark">GMAIL<span class="text-gmailRed">KU</span></h1>
                            <p class="text-gray-500 text-sm mt-1">Platform Freelance Pembuatan Gmail</p>
                        </div>
                        <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Username (Masuk / Daftar)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="authUsername" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gmailBlue text-sm font-medium" placeholder="Masukkan username">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="authPassword" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gmailBlue text-sm font-medium" placeholder="Masukkan password">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-gmailRed text-white font-bold rounded-xl shadow-lg shadow-red-500/30 hover:bg-red-600 transition uppercase tracking-wider text-sm flex items-center justify-center space-x-2">
                                <span>Masuk / Daftar Akun</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('authUsername').value.trim();
            const p = document.getElementById('authPassword').value.trim();
            if (!u || !p) { showToast('Semua kolom harus diisi!', 'error'); return; }

            let found = db.users.find(x => x.username === u && x.pass === p);
            if (found) {
                db.currentUser = found;
                showToast(`Selamat datang kembali, ${found.username}!`, 'success');
            } else {
                const existing = db.users.find(x => x.username === u);
                if (existing) {
                    showToast('Password salah untuk username tersebut!', 'error');
                    return;
                }
                const newUser = { username: u, pass: p, role: 'user', saldo: 0, gmailsCreated: 0, telegramLinked: '' };
                db.users.push(newUser);
                db.currentUser = newUser;
                showToast('Akun baru berhasil didaftarkan!', 'success');
            }
            saveData();
            render();
        }

        function logout() {
            db.currentUser = null;
            saveData();
            render();
            showToast('Berhasil keluar akun.', 'info');
        }

        // --- USER DASHBOARD ---
        function renderUserDashboard() {
            return `
                <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-gmailRed rounded-xl flex items-center justify-center text-white shadow-md">
                                <i class="fa-solid fa-envelope text-xl"></i>
                            </div>
                            <div>
                                <span class="text-2xl font-display tracking-wide text-gmailDark">GMAIL<span class="text-gmailRed">KU</span></span>
                                <span class="block text-[10px] uppercase font-bold text-gray-400">Freelance Platform</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="bg-amber-50 border border-amber-200 px-4 py-1.5 rounded-2xl flex items-center space-x-2">
                                <div class="w-7 h-7 bg-gmailYellow rounded-full flex items-center justify-center text-white text-xs">
                                    <i class="fa-solid fa-wallet"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase font-bold text-amber-700 leading-none">Saldo</p>
                                    <p class="text-sm font-extrabold text-amber-900">Rp ${db.currentUser.saldo.toLocaleString('id-ID')}</p>
                                </div>
                            </div>
                            <button onclick="logout()" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-sm font-bold flex items-center space-x-1">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="hidden md:inline">Keluar</span>
                            </button>
                        </div>
                    </div>
                    <div class="max-w-6xl mx-auto px-4 flex space-x-6 border-t border-gray-100">
                        <button onclick="switchUserTab('tugas')" class="py-3 px-1 text-sm font-bold border-b-2 transition flex items-center space-x-2 ${userTab === 'tugas' ? 'border-gmailRed text-gmailRed' : 'border-transparent text-gray-500 hover:text-gray-800'}">
                            <i class="fa-solid fa-list-check"></i>
                            <span>Buat Gmail & Tugas</span>
                        </button>
                        <button onclick="switchUserTab('riwayat')" class="py-3 px-1 text-sm font-bold border-b-2 transition flex items-center space-x-2 ${userTab === 'riwayat' ? 'border-gmailBlue text-gmailBlue' : 'border-transparent text-gray-500 hover:text-gray-800'}">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <span>Riwayat</span>
                        </button>
                        <button onclick="switchUserTab('withdraw')" class="py-3 px-1 text-sm font-bold border-b-2 transition flex items-center space-x-2 ${userTab === 'withdraw' ? 'border-gmailGreen text-gmailGreen' : 'border-transparent text-gray-500 hover:text-gray-800'}">
                            <i class="fa-solid fa-money-bill-transfer"></i>
                            <span>Tarik Saldo</span>
                        </button>
                    </div>
                </header>
                <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">
                    ${userTab === 'tugas' ? renderUserTugasTab() : userTab === 'riwayat' ? renderUserRiwayatTab() : renderUserWithdrawTab()}
                </main>
            `;
        }

        function switchUserTab(tab) {
            userTab = tab;
            render();
        }

        function renderUserTugasTab() {
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="space-y-6">
                        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                            <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-gmailRed mb-4">
                                <i class="fa-brands fa-telegram text-2xl"></i>
                            </div>
                            <h2 class="text-xl font-bold text-gmailDark mb-2">Bot Gmailku</h2>
                            <p class="text-sm text-gray-600 mb-6">Ambil format data pembuatan Gmail secara otomatis melalui sistem bot Telegram resmi.</p>
                            
                            <div class="space-y-3 mb-6 text-xs text-gray-600">
                                <div class="flex items-center space-x-2">
                                    <div class="w-5 h-5 rounded-full bg-blue-100 text-gmailBlue flex items-center justify-center font-bold">1</div>
                                    <span>Kirim <strong class="text-gmailDark">/start</strong></span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="w-5 h-5 rounded-full bg-blue-100 text-gmailBlue flex items-center justify-center font-bold">2</div>
                                    <span>Pilih <strong class="text-gmailDark">Freelance buat gmail</strong></span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="w-5 h-5 rounded-full bg-blue-100 text-gmailBlue flex items-center justify-center font-bold">3</div>
                                    <span>Salin format data & selesaikan</span>
                                </div>
                            </div>

                            <button onclick="startBotTask()" class="w-full py-4 bg-gmailBlue hover:bg-blue-600 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/30 transition text-sm flex items-center justify-center space-x-2 uppercase">
                                <i class="fa-solid fa-robot"></i>
                                <span>Mulai Buat Gmail</span>
                            </button>
                        </div>
                    </div>

                    <div class="lg:col-span-2">
                        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 flex flex-col h-[520px] overflow-hidden">
                            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-3 h-3 bg-gmailGreen rounded-full animate-pulse"></div>
                                    <span class="font-bold text-sm text-gmailDark">Papan Chat & Format Bot</span>
                                </div>
                                <span class="text-xs bg-red-50 text-gmailRed font-bold px-3 py-1 rounded-full">Komisi: Rp 8.000</span>
                            </div>

                            <div class="p-6 flex-1 bg-gray-50/50 overflow-y-auto space-y-4">
                                ${db.activeTask ? renderActiveTaskBox() : `
                                    <div class="h-full flex flex-col items-center justify-center text-center text-gray-400">
                                        <i class="fa-solid fa-comments text-4xl mb-3"></i>
                                        <p class="font-bold text-gray-600">Belum ada format tugas aktif</p>
                                        <p class="text-xs mt-1">Klik tombol <strong class="text-gmailBlue">"Mulai Buat Gmail"</strong> di sebelah kiri.</p>
                                    </div>
                                `}
                            </div>

                            <div class="p-4 bg-white border-t border-gray-200 flex items-center space-x-4">
                                <button onclick="taskAction('cancel')" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl text-sm transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-xmark"></i>
                                    <span>Batal</span>
                                </button>
                                <button onclick="taskAction('finish')" class="flex-1 py-3 bg-gmailGreen hover:bg-green-600 text-white font-bold rounded-2xl shadow-md text-sm transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-check"></i>
                                    <span>Selesai (+Rp 8.000)</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderActiveTaskBox() {
            const t = db.activeTask;
            const text = db.customFormatTemplate
                .replace('{year}', t.year)
                .replace('{email}', t.email)
                .replace('{password}', t.password);

            return `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-gmailBlue text-white flex items-center justify-center text-xs font-bold shrink-0">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-lg w-full space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-gmailBlue">Gmailku</span>
                            <button onclick="copyFormatData()" class="px-3 py-1 bg-gray-100 hover:bg-gmailBlue hover:text-white text-gray-700 rounded-lg text-xs font-bold transition flex items-center space-x-1">
                                <i class="fa-solid fa-copy"></i>
                                <span>Salin</span>
                            </button>
                        </div>
                        <pre id="formatText" class="bg-gray-50 p-3 rounded-xl border border-gray-200 font-mono text-xs text-gray-800 whitespace-pre-wrap">${text}</pre>
                        <p class="text-[11px] text-gray-500 italic">Buat Gmail di browser/perangkat Anda sesuai data di atas, lalu klik Selesai.</p>
                    </div>
                </div>
            `;
        }

        function startBotTask() {
            db.activeTask = generateRandomGmailData();
            saveData();
            render();
            showToast('Format berhasil diambil dari bot Gmailku!', 'success');
        }

        function copyFormatData() {
            if (!db.activeTask) return;
            const t = db.activeTask;
            const text = db.customFormatTemplate
                .replace('{year}', t.year)
                .replace('{email}', t.email)
                .replace('{password}', t.password);
            
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Format berhasil disalin ke clipboard!', 'success');
            } catch (err) {
                showToast('Gagal menyalin teks.', 'error');
            }
            document.body.removeChild(textarea);
        }

        function taskAction(type) {
            if (!db.activeTask) {
                showToast('Tidak ada tugas aktif saat ini!', 'error');
                return;
            }
            if (type === 'finish') {
                const reward = 8000;
                db.currentUser.saldo += reward;
                db.currentUser.gmailsCreated += 1;
                db.globalGmailsCreated += 1;

                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                db.history.unshift({
                    type: 'gmail',
                    desc: `Pembuatan Gmail: ${db.activeTask.email}`,
                    reward: reward,
                    date: dateStr
                });

                db.activeTask = null;
                saveData();
                render();
                showToast('Tugas selesai! Saldo Rp 8.000 ditambahkan.', 'success');
            } else {
                db.activeTask = null;
                saveData();
                render();
                showToast('Tugas dibatalkan.', 'info');
            }
        }

        function renderUserRiwayatTab() {
            return `
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <h2 class="text-xl font-bold text-gmailDark mb-4">Riwayat Aktivitas & Penarikan</h2>
                    ${db.history.length === 0 ? '<p class="text-gray-400 text-sm">Belum ada riwayat.</p>' : `
                        <div class="space-y-3">
                            ${db.history.map(h => `
                                <div class="p-4 bg-gray-50 rounded-2xl border border-gray-200 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl ${h.type === 'gmail' ? 'bg-green-100 text-gmailGreen' : 'bg-blue-100 text-gmailBlue'} flex items-center justify-center font-bold">
                                            <i class="fa-solid ${h.type === 'gmail' ? 'fa-envelope-circle-check' : 'fa-money-bill-transfer'}"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm font-bold text-gmailDark">${h.desc}</p>
                                            <p class="text-xs text-gray-400">${h.date}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-extrabold ${h.type === 'gmail' ? 'text-gmailGreen' : 'text-gmailRed'}">
                                            ${h.type === 'gmail' ? `+Rp ${h.reward.toLocaleString('id-ID')}` : `-Rp ${h.amount.toLocaleString('id-ID')}`}
                                        </p>
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${h.type === 'gmail' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">${h.status || 'Selesai'}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderUserWithdrawTab() {
            return `
                <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-200">
                    <div class="text-center mb-6">
                        <div class="w-14 h-14 bg-green-50 text-gmailGreen rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gmailDark">Tarik Saldo Anda</h2>
                        <p class="text-xs text-gray-500 mt-1">Minimal penarikan saldo adalah <strong class="text-gmailDark">Rp 15.000</strong></p>
                    </div>

                    <form onsubmit="handleWithdrawSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-500 mb-1.5">Metode Pembayaran</label>
                            <select id="wMethod" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium">
                                <option value="DANA">DANA</option>
                                <option value="OVO">OVO</option>
                                <option value="GOPAY">GOPAY</option>
                                <option value="SEA BANK">SEA BANK</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-500 mb-1.5">Nomor Akun / HP</label>
                            <input type="text" id="wNum" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium" placeholder="081234567890">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-gray-500 mb-1.5">Jumlah Penarikan (Rp)</label>
                            <input type="number" id="wAmt" min="15000" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium" placeholder="Min. 15000">
                        </div>
                        <button type="submit" class="w-full py-4 bg-gmailGreen hover:bg-green-600 text-white font-bold rounded-xl shadow-lg shadow-green-500/30 transition text-sm uppercase">
                            Ajukan Penarikan
                        </button>
                    </form>
                </div>
            `;
        }

        function handleWithdrawSubmit(e) {
            e.preventDefault();
            const method = document.getElementById('wMethod').value;
            const number = document.getElementById('wNum').value.trim();
            const amount = parseInt(document.getElementById('wAmt').value);

            if (amount < 15000) {
                showToast('Minimal penarikan adalah Rp 15.000!', 'error');
                return;
            }
            if (db.currentUser.saldo < amount) {
                showToast('Saldo Anda tidak mencukupi!', 'error');
                return;
            }

            db.currentUser.saldo -= amount;
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            db.withdrawals.unshift({
                id: 'W' + Math.floor(Math.random() * 90000 + 10000),
                username: db.currentUser.username,
                method, number, amount, status: 'Berhasil', date: dateStr
            });

            db.history.unshift({
                type: 'withdraw',
                desc: `Penarikan ${method} (${number})`,
                amount: amount,
                status: 'Berhasil',
                date: dateStr
            });

            saveData();
            render();
            showToast(`Penarikan Rp ${amount.toLocaleString('id-ID')} via ${method} berhasil!`, 'success');
        }
